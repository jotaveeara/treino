<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121110">
<title>Treino do Pedro</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar__row">
      <span class="topbar__plate">●</span>
      <h1 class="topbar__title">Treino do Pedro</h1>
    </div>
    <p class="topbar__date" id="dataAtual"></p>
  </header>

  <main id="app">

    <!-- ABA HOJE -->
    <section class="view" id="view-hoje">
      <div class="dia-hero" id="diaHero">
        <span class="dia-hero__label">Hoje é</span>
        <h2 class="dia-hero__nome" id="diaNome">—</h2>
        <p class="dia-hero__foco" id="diaFoco">—</p>
      </div>

      <div id="listaExercicios" class="grupo-lista"></div>

      <div class="cardio-bloco" id="cardioBloco" hidden>
        <span class="cardio-bloco__icone">◐</span>
        <div>
          <strong>Cardio</strong>
          <p id="cardioTexto"></p>
        </div>
      </div>

      <div class="descanso-bloco" id="descansoBloco" hidden>
        <span class="descanso-bloco__icone">☾</span>
        <p>Dia de descanso. Aproveite para recuperar — só o cardio na agenda de hoje.</p>
      </div>
    </section>

    <!-- ABA SEMANA -->
    <section class="view" id="view-semana" hidden>
      <h2 class="secao-titulo">A semana inteira</h2>
      <div id="listaSemana" class="semana-lista"></div>
    </section>

    <!-- ABA PROGRESSO -->
    <section class="view" id="view-progresso" hidden>
      <h2 class="secao-titulo">Progresso</h2>
      <div class="progresso-seletor">
        <select id="seletorExercicio"></select>
      </div>
      <div id="progressoConteudo"></div>
    </section>

  </main>

  <nav class="tabbar">
    <button class="tabbar__item is-active" data-view="hoje">
      <span class="tabbar__icone">▲</span>
      <span>Hoje</span>
    </button>
    <button class="tabbar__item" data-view="semana">
      <span class="tabbar__icone">▦</span>
      <span>Semana</span>
    </button>
    <button class="tabbar__item" data-view="progresso">
      <span class="tabbar__icone">↗</span>
      <span>Progresso</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
